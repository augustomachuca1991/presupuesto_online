name: Vencer presupuestos

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  vencer:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar Edge Function
        run: |
          curl -L -X POST "${{ secrets.SUPABASE_EDGE_FUNCTION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
